<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#eef0ff}
.stack{display:flex;flex-direction:column;align-items:center;width:1152px;max-width:100%}
.grid{display:grid;gap:40px;width:100%;grid-template-columns:repeat(3,1fr)}
.card{display:flex;flex-direction:column;gap:32px;background:white;border-radius:8px;padding:16px 16px 32px;max-width:374px;width:100%}
.image{width:100%;height:195px;background:#003af4}
.content{display:flex;flex-direction:column;flex:1 1 0%;padding-left:12px;padding-right:12px;gap:24px}
.text{width:100%;height:72px;background:#ccd5ff}
</style></head><body><div class="stack"><div class="grid"><div class="card"><div class="image"></div><div class="content"><div class="text"></div></div></div><div class="card"><div class="image"></div><div class="content"><div class="text"></div></div></div><div class="card"><div class="image"></div><div class="content"><div class="text"></div></div></div></div></div></body></html>
