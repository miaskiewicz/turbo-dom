name: Snapshot context lifetime diagnostic

on:
  push:
    branches: [codex/084-snapshot-context-release]
    paths:
      - '.github/workflows/snapshot-context-diagnostic.yml'
      - 'scripts/snapshot_gc_diagnostic.py'
      - 'crates/turbo-dom-browser-env/**'

permissions:
  contents: read

concurrency:
  group: snapshot-context-diagnostic-${{ github.run_id }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.98.0
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_BUILD_JOBS: 2
  TZ: UTC
  CARGO_TARGET_DIR: target-browser-env-default

jobs:
  v8:
    name: Linux x64 default snapshot lifetime
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.0
      - name: Generate the exact release V8 fork
        run: python3 crates/turbo-dom-v8/scripts/generate.py --download --write
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/rusty_v8
          key: rusty-v8-150.4.0-x86_64-unknown-linux-gnu-default
      - name: Official default V8 archive
        run: |
          dir="$RUNNER_TEMP/rusty_v8"
          file="$dir/librusty_v8_release_x86_64-unknown-linux-gnu.a"
          mkdir -p "$dir"
          if [ ! -s "$file" ]; then
            curl -fsSL --retry 3 -o "$file.gz" "https://github.com/denoland/rusty_v8/releases/download/v150.4.0/$(basename "$file").gz"
            gunzip -f "$file.gz"
          fi
          echo "RUSTY_V8_ARCHIVE=$file" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: v8-default
          workspaces: . -> target-browser-env-default
          cache-on-failure: true
      - name: Build the actual native library test binary
        run: |
          mkdir -p snapshot-context-results
          rustc -Vv > snapshot-context-results/toolchain.txt
          git rev-parse HEAD > snapshot-context-results/head.txt
          sha256sum "$RUSTY_V8_ARCHIVE" > snapshot-context-results/archive.sha256
          cargo test -p turbo-dom-browser-env --config 'patch.crates-io.turbo-dom-v8.path="crates/turbo-dom-v8/crate"' --features host-internals,test-support --lib --no-run --message-format=json > snapshot-context-results/build.jsonl
      - name: Exact original tests, isolated and concurrent
        run: python3 scripts/snapshot_gc_diagnostic.py --build snapshot-context-results/build.jsonl --out snapshot-context-results
      - name: Preserve every result, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snapshot-context-lifetime-${{ github.run_id }}
          path: snapshot-context-results
          if-no-files-found: error
