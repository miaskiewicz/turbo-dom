name: Mutation sweep 487

on:
  push:
    branches: [codex/084-mutation-487]
    paths:
      - '.github/workflows/mutation-sweep.yml'
      - 'scripts/mutation*'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/turbo-dom-browser-env/**'
      - 'crates/turbo-dom-raster/**'
      - 'crates/turbo-dom-v8/**'
  workflow_dispatch:
    inputs:
      mode:
        description: Pilot first; full only after reviewing measured cost and misses
        type: choice
        options: [pilot, full]
        default: pilot

permissions:
  contents: read

concurrency:
  group: mutation-487-${{ github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_TEST_THREADS: 2
  # Mutant-created unused variables must not become false compile rejections.
  # The same setting applies to the unmutated baseline. Ordinary CI stays strict.
  CARGO_ENCODED_RUSTFLAGS: --cap-lints=warn
  TZ: UTC

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: plan
        run: echo "matrix=$(python3 scripts/mutation_sweep.py matrix --mode '${{ inputs.mode }}')" >> "$GITHUB_OUTPUT"

  sweep:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.mode }} / ${{ matrix.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.0
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-mutants@27.1.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: mutation-487-${{ matrix.target }}
          cache-on-failure: true
      - name: Cache official V8 archive
        if: matrix.browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/rusty-v8-mutation
          key: mutation-v8-${{ hashFiles('crates/turbo-dom-v8/pins.json') }}-linux-x64
      - name: Official V8 archive used by the pinned Rust-only fork
        if: matrix.browser
        run: |
          version=$(python3 -c "import json; print(json.load(open('crates/turbo-dom-v8/pins.json'))['upstream']['version'])")
          dir="$RUNNER_TEMP/rusty-v8-mutation"
          file="$dir/librusty_v8_release_x86_64-unknown-linux-gnu.a"
          mkdir -p "$dir"
          if [ ! -s "$file" ]; then
            curl -fsSL --retry 3 -o "$file.gz" "https://github.com/denoland/rusty_v8/releases/download/v$version/$(basename "$file").gz"
            gunzip -f "$file.gz"
          fi
          echo "RUSTY_V8_ARCHIVE=$file" >> "$GITHUB_ENV"
      - name: Baseline then deterministic mutation shard
        timeout-minutes: 32
        run: >-
          python3 scripts/mutation_sweep.py run
          --target '${{ matrix.target }}' --mode '${{ matrix.mode }}'
          --shard '${{ matrix.shard }}' --shards '${{ matrix.shards }}'
          --output 'mutation-results/${{ matrix.id }}'
      - name: Preserve all raw results, including failures and partial runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-487-${{ matrix.id }}
          path: mutation-results/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: [plan, sweep]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mutation-487-*
          path: mutation-results
      - name: Reject missing, overlapping, unresolved or mixed-scope evidence
        run: python3 scripts/mutation_sweep.py aggregate mutation-results
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-487-aggregate
          path: mutation-results/aggregate.json
          if-no-files-found: warn
